name: CI
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Check out code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Install lint tools
        run: pip install ruff
 
      - name: Lint with ruff
        run: ruff check .
 
      - name: Run tests
        run: pytest -v
 
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
 
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t notification-service:ci .
 
